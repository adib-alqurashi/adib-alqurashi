<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Education: KFUPM, B.S. Data Science, third year. Currently: Studying Introduction to Data Science; Competing in a Kaggle competition; Stage 1 of KAUST Academy; Preparing for mathematics competitions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#0f1a33"/>
      <stop offset="1" stop-color="#0b2a2c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="300" rx="18"/></clipPath>
    <clipPath id="panel"><rect x="30" y="30" width="440" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    .row { animation: slide .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes slide { from { transform: translateX(-12px); } to { transform: none; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(.6); opacity: .5; } 100% { transform: scale(1.8); opacity: 0; } }
    .sheen { animation: sheen 5s ease-in-out infinite; }
    @keyframes sheen { 0% { transform: translateX(-420px); } 60%,100% { transform: translateX(520px); } }
    .live { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
  </style>
  <g clip-path="url(#clip)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif">
    <rect width="1000" height="300" rx="18" fill="url(#bg)"/><rect width="1000" height="300" rx="18" fill="url(#grid)"/><rect x="0.5" y="0.5" width="999" height="299" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- left: education -->
    <g>
      <rect x="30" y="30" width="440" height="240" rx="14" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/>
      <g clip-path="url(#panel)"><rect class="sheen" x="30" y="30" width="160" height="240" fill="url(#sheen)"/></g>
      <text x="56" y="70" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#fbbf24" letter-spacing="2">EDUCATION</text>
      <text x="56" y="114" font-size="38" font-weight="800" fill="#e6edf3" letter-spacing="1">KFUPM</text>
      <text x="56" y="142" font-size="14.5" fill="#8b9bb4">King Fahd University of Petroleum &amp; Minerals</text>
      <text x="56" y="182" font-size="17" font-weight="600" fill="#e6edf3">B.S. in Data Science</text>
      <rect x="56" y="200" width="88" height="28" rx="14" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-opacity=".5"/>
      <text x="100" y="219" text-anchor="middle" font-size="13.5" font-weight="700" fill="#34d399">3rd year</text>
      <text x="158" y="219" font-size="13.5" fill="#8b9bb4">DSE &amp; Computer Clubs member</text>
      <rect x="56" y="244" width="388" height="4" rx="2" fill="url(#bar)" opacity=".7"/>
    </g>
    <!-- right: currently -->
    <g>
      <text x="530" y="70" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#2dd4bf" letter-spacing="2">CURRENTLY</text>
      <circle class="live" cx="642" cy="65.5" r="4" fill="#f87171"/>
      <text x="652" y="70" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#f87171" letter-spacing="1.5">LIVE</text>
      
      <g class="row" style="animation-delay:0.40s">
        <circle cx="548" cy="106" r="11" fill="#2dd4bf" opacity=".18" class="ring" style="animation-delay:0.0s"/>
        <circle cx="548" cy="106" r="5" fill="#2dd4bf"/>
        <text x="572" y="112" font-size="17" fill="#e6edf3">Studying Introduction to Data Science</text>
      </g>
      <g class="row" style="animation-delay:0.58s">
        <circle cx="548" cy="148" r="11" fill="#fbbf24" opacity=".18" class="ring" style="animation-delay:0.5s"/>
        <circle cx="548" cy="148" r="5" fill="#fbbf24"/>
        <text x="572" y="154" font-size="17" fill="#e6edf3">Competing in a Kaggle competition</text>
      </g>
      <g class="row" style="animation-delay:0.76s">
        <circle cx="548" cy="190" r="11" fill="#60a5fa" opacity=".18" class="ring" style="animation-delay:1.0s"/>
        <circle cx="548" cy="190" r="5" fill="#60a5fa"/>
        <text x="572" y="196" font-size="17" fill="#e6edf3">Stage 1 of KAUST Academy</text>
      </g>
      <g class="row" style="animation-delay:0.94s">
        <circle cx="548" cy="232" r="11" fill="#a78bfa" opacity=".18" class="ring" style="animation-delay:1.5s"/>
        <circle cx="548" cy="232" r="5" fill="#a78bfa"/>
        <text x="572" y="238" font-size="17" fill="#e6edf3">Preparing for mathematics competitions</text>
      </g>
    </g>
  </g>
</svg>
