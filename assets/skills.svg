<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 368" width="1000" height="368" role="img" aria-label="Skills: LANGUAGES: Python, Java; PYTHON LIBRARIES: NumPy, pandas, Matplotlib, scikit-learn; CS FOUNDATIONS: OOP with Java, Data Structures, Algorithms; SCIENTIFIC WRITING: LaTeX, Overleaf">
  <defs>
