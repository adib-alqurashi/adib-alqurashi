  <style>
    .sym { font-family: 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif; font-style: italic; fill: #9fb3d9; opacity: 0;
            animation-name: drift; animation-iteration-count: infinite; animation-timing-function: linear; }
    @keyframes drift { 0% { opacity: 0; transform: translateY(20px); } 20% { opacity: .22; }
                        80% { opacity: .22; } 100% { opacity: 0; transform: translateY(-60px); } }
    .pt { opacity: .35; animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
    .fit { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 7s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 700; opacity: 1; } 40% { stroke-dashoffset: 0; }
                       85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .in1, .in2, .in3, .in4 { animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .in2 { animation-delay: .25s; } .in3 { animation-delay: .5s; } .in4 { animation-delay: .75s; }
    @keyframes rise { from { transform: translateY(14px); } to { transform: none; } }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .eq { font-family: 'Latin Modern Roman', 'CMU Serif', 'Times New Roman', Georgia, serif; font-style: italic; fill: #cfe3ff; opacity: .55; }
