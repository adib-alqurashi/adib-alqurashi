name: Generate contribution graph

on:
  schedule:
    - cron: "0 0 * * *"   # every day
  workflow_dispatch:       # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw contribution grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTIVITY_JSON=activity.json python3 .github/scripts/contrib.py "${{ github.repository_owner }}" dist/days.svg
          THEME=light python3 .github/scripts/contrib.py "${{ github.repository_owner }}" dist/days-light.svg

      - name: Draw the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ec4899&color_dots=#161222,#3b1d6e,#6d28d9,#a855f7,#d8b4fe
            dist/snake-light.svg?palette=github-light&color_snake=#db2777&color_dots=#f1eef6,#ddd0fb,#b794f6,#8b5cf6,#6d28d9

      - name: Draw the one-block profile card
        run: python3 .github/scripts/profile.py dist activity.json dist

      - name: Push to output branch
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution graph"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
