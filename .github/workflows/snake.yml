name: Draw profile

on:
  schedule:
    - cron: "0 0 * * *"   # every day
  workflow_dispatch:       # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

concurrency:  # two pushes close together would race to force-push the output branch
  group: draw-profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fontTools (embeds only the letters each image uses)
        run: python3 -m pip install --quiet fonttools

      - name: Draw contribution grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}  # your own read:user token; see contrib.py
        run: |
          ACTIVITY_JSON=dist/activity.json python3 .github/scripts/contrib.py "${{ github.repository_owner }}" dist/days.svg
          THEME=light python3 .github/scripts/contrib.py "${{ github.repository_owner }}" dist/days-light.svg

      - name: Draw the profile page (activity section uses dist/activity.json)
        run: python3 .github/scripts/profile.py dist dist/activity.json

      - name: Push to output branch
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution graph"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
