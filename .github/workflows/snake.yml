name: Generate contribution graph

on:
  schedule:
    - cron: "0 0 * * *"   # every day
  workflow_dispatch:       # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw contribution grid
        env:
          # Your own token, so a private profile still shows your activity here.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/contrib.py "${{ github.repository_owner }}" dist/contrib.svg
          THEME=light python3 .github/scripts/contrib.py "${{ github.repository_owner }}" dist/contrib-light.svg

      - name: Push to output branch
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution graph"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
